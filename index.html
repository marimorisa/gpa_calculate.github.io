<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPA計算ツール</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* === MODERN "REIWA" DESIGN SYSTEM === */
        :root {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --primary-gradient: linear-gradient(135deg, #60a5fa, #3b82f6);
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #10b981;
            --warning: #f59e0b;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #334155;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --radius-md: 8px;
            --radius-lg: 12px;
        }

        body { 
            font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            padding: 20px; 
            max-width: 900px; 
            margin: auto; 
            box-sizing: border-box; 
            line-height: 1.6;
        }

        h2 { 
            font-weight: 700;
            font-size: 1.8rem;
            color: #1e293b;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        h3 {
            font-weight: 700;
            font-size: 1.25rem;
            color: #1e293b;
            margin-top: 0;
            margin-bottom: 16px;
        }

        .card { 
            background-color: var(--card-bg); 
            padding: 24px; 
            margin-bottom: 24px; 
            border-radius: var(--radius-lg); 
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
            transition: box-shadow 0.3s ease;
        }
        .card:hover {
            box-shadow: var(--shadow-lg);
        }
        
        .info-box {
            background-color: #eff6ff;
            border-left: 4px solid var(--primary);
            padding: 12px 16px;
            border-radius: 0 var(--radius-md) var(--radius-md) 0;
            margin-bottom: 20px;
        }

        .form-group { margin-bottom: 16px; display: flex; align-items: center; }
        label { display: inline-block; width: 140px; font-weight: 500; flex-shrink: 0; color: var(--text-main); }
        
        input[type="text"], input[type="number"], select { 
            background-color: #fff;
            color: var(--text-main); 
            border: 1px solid #cbd5e1; 
            padding: 10px 12px; 
            flex-grow: 1; 
            max-width: 320px; 
            border-radius: var(--radius-md); 
            font-family: inherit;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }
        input[type="text"]:focus, input[type="number"]:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }
        
        input[type="checkbox"] { 
            accent-color: var(--primary);
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .btn { 
            padding: 10px 20px; 
            border: none; 
            cursor: pointer; 
            border-radius: var(--radius-md); 
            font-size: 0.95rem; 
            font-weight: 500; 
            font-family: inherit;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-sm);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn:active { transform: translateY(1px); }
        .btn-primary { background: var(--primary-gradient); color: #fff; }
        .btn-primary:hover { background: var(--primary); box-shadow: var(--shadow-md); }
        .btn-danger { background-color: var(--card-bg); color: var(--danger); border: 1px solid var(--danger); box-shadow: none; }
        .btn-danger:hover { background-color: #fef2f2; }
        .btn-success { background-color: var(--success); color: #fff; }
        .btn-success:hover { background-color: #059669; }
        .btn-secondary { background-color: #f1f5f9; color: var(--text-main); border: 1px solid #cbd5e1; box-shadow: none; }
        .btn-secondary:hover { background-color: #e2e8f0; }
        .btn-edit { background-color: var(--card-bg); color: var(--primary); border: 1px solid var(--primary); box-shadow: none; }
        .btn-edit:hover { background-color: #eff6ff; }
        .btn-sm { padding: 6px 12px; font-size: 0.85rem; margin-right: 4px; }

        .table-responsive { width: 100%; overflow-x: auto; margin-top: 10px; border-radius: var(--radius-lg); border: 1px solid var(--border-color); background: #fff; }
        table { border-collapse: collapse; width: 100%; min-width: 750px; background-color: transparent; }
        th, td { padding: 14px 12px; text-align: left; vertical-align: middle; border-bottom: 1px solid var(--border-color); }
        th { background-color: #f8fafc; color: var(--text-muted); font-weight: 500; font-size: 0.9rem; }
        tr:last-child td { border-bottom: none; }
        
        .term-table-wrapper { margin-top: 15px; max-height: 450px; overflow-y: auto; overflow-x: auto; border: 1px solid var(--border-color); border-radius: var(--radius-md); }
        .term-table { width: 100%; min-width: 550px; border-collapse: separate; border-spacing: 0; }
        .term-table th { position: sticky; top: 0; background-color: #f8fafc; z-index: 1; border-bottom: 1px solid var(--border-color); }
        .term-table th:first-child { left: 0; z-index: 3; box-shadow: 2px 0 5px rgba(0,0,0,0.05); border-right: 1px solid var(--border-color); }
        .term-table td:first-child { position: sticky; left: 0; background-color: #fff; z-index: 2; box-shadow: 2px 0 5px rgba(0,0,0,0.05); border-right: 1px solid var(--border-color); }
        .term-table tr:hover td { background-color: #f8fafc; }
        .term-table tr:hover td:first-child { background-color: #f1f5f9; }

        th.sortable { cursor: pointer; user-select: none; position: relative; padding-right: 20px; transition: background-color 0.2s; }
        th.sortable:hover { background-color: #e2e8f0; color: var(--text-main); }
        .sort-icon { font-size: 10px; color: var(--text-muted); position: absolute; right: 8px; top: 50%; transform: translateY(-50%); }

        .text-center { text-align: center; }
        .edit-input { width: 100%; box-sizing: border-box; padding: 6px; font-size: 0.9rem; }
        .edit-input-num { width: 70px; box-sizing: border-box; padding: 6px; font-size: 0.9rem; }

        .excluded { color: #94a3b8; background-color: #f8fafc; text-decoration: line-through; }
        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 12px; }
        
        .manual-input-box { display: none; margin-top: 20px; padding-top: 20px; border-top: 1px dashed var(--border-color); }

        .results p { margin: 8px 0; display: flex; justify-content: space-between; align-items: center; }
        .results hr { border: none; border-top: 1px dashed #cbd5e1; margin: 16px 0; }
        .gpa-value { font-weight: 700; font-size: 1.25rem; color: var(--primary); }
        .gpa-total-value { font-weight: 700; font-size: 1.8rem; color: var(--primary); }

        @media screen and (max-width: 768px) {
            body { padding: 12px; }
            .form-group { flex-direction: column; align-items: stretch; margin-bottom: 12px; }
            label { width: 100%; margin-bottom: 6px; font-size: 0.9rem; }
            input[type="text"], input[type="number"], select { max-width: 100%; width: 100%; }
            .header-flex { flex-direction: column; align-items: stretch; }
            .btn { width: 100%; margin-bottom: 8px; box-sizing: border-box; justify-content: center; }
            .action-buttons { display: flex; flex-direction: column; gap: 6px; }
            .action-buttons .btn { margin: 0; }
        }
    </style>
</head>
<body>

    <h2>📊 GPA計算ツール</h2>
    
    <div class="card" id="departmentCard" style="display: none;">
        <div class="form-group" style="margin-bottom: 0;">
            <label>所属学科</label>
            <select id="departmentSelect" onchange="updateView()">
                <option value="life_science" selected>生命薬科学科 (選択科目は上位14単位)</option>
                <option value="pharmacy">薬学科 (選択科目は上位10単位)</option>
            </select>
        </div>
    </div>

    <div class="card">
        <h3>📥 成績の一括入力</h3>
        
        <div class="form-group" style="margin-bottom: 8px;">
            <label>開講時期を選択</label>
            <select id="termSelect" onchange="renderTermCourses()">
                <option value="">-- 時期を選択してください --</option>
                <option value="1年前期">1年前期</option>
                <option value="1年後期">1年後期</option>
                <option value="1年通期">1年通期</option>
                <option value="2年前期">2年前期</option>
                <option value="2年後期">2年後期</option>
                <option value="2年通期">2年通期</option>
                <option value="3年前期">3年前期</option>
                <option value="manual">手動入力 (その他の科目)</option>
            </select>
        </div>
        
        <div id="termCourseContainer" style="display: none;">
            <div class="info-box">
                <span style="font-size: 0.85rem; color: #1e3a8a;">
                    💡 必修科目は自動でチェックが固定されています。成績を選んで「一括登録」を押してください。<br>
                    （成績が「--」のままの科目はスキップされ、エラーにはなりません）
                </span>
            </div>
            
            <div class="term-table-wrapper">
                <table class="term-table">
                    <thead>
                        <tr>
                            <th>履修・科目名</th>
                            <th>区分</th>
                            <th style="width: 70px;">単位</th>
                            <th>成績 (秀〜不可)</th>
                        </tr>
                    </thead>
                    <tbody id="termCourseBody">
                        <!-- JSで自動生成 -->
                    </tbody>
                </table>
            </div>
            <div style="margin-top: 20px; text-align: center;">
                <button class="btn btn-primary" id="addCheckedBtn" onclick="addCheckedCourses()" style="width: 100%; padding: 14px; font-size: 1.05rem;">✅ チェックした科目を一括登録</button>
            </div>
        </div>

        <div id="manualInputContainer" class="manual-input-box">
            <h4>手動追加フォーム</h4>
            <div class="form-group">
                <label>開講時期</label>
                <select id="manualTerm">
                    <option value="その他">その他</option>
                    <option value="1年前期">1年前期</option>
                    <option value="1年後期">1年後期</option>
                    <option value="1年通期">1年通期</option>
                    <option value="2年前期">2年前期</option>
                    <option value="2年後期">2年後期</option>
                    <option value="2年通期">2年通期</option>
                    <option value="3年前期">3年前期</option>
                </select>
            </div>
            <div class="form-group">
                <label>科目名</label>
                <input type="text" id="manualName" placeholder="例: 経済学入門">
            </div>
            <div class="form-group">
                <label>科目区分</label>
                <select id="manualCategory">
                    <option value="specialized_compulsory">専門科目 (必修)</option>
                    <option value="specialized_elective">専門科目 (選択)</option>
                </select>
            </div>
            <div class="form-group">
                <label>単位数</label>
                <input type="number" id="manualCredits" min="1" value="2">
            </div>
            <div class="form-group">
                <label>成績</label>
                <select id="manualGrade">
                    <option value="" selected>-- 選択 --</option>
                    <option value="4|秀">秀 (4.0)</option>
                    <option value="3|優">優 (3.0)</option>
                    <option value="2|良">良 (2.0)</option>
                    <option value="1|可">可 (1.0)</option>
                    <option value="0|不可">不可 (0.0)</option>
                </select>
            </div>
            <button class="btn btn-primary" onclick="addManualCourse()" style="margin-top: 10px;">科目を作成して追加</button>
        </div>
    </div>

    <div class="card results">
        <h3>✨ 計算結果 (GPA)</h3>
        <p><span>専門科目(必修) GPA:</span> <span id="gpaCompulsory" class="gpa-value">0.00</span></p>
        <p>
            <span>専門科目(選択) GPA:<br><small id="electiveNote1" style="color:var(--text-muted); font-weight:normal;">(※成績上位14単位分のみ計算)</small></span> 
            <span id="gpaElective" class="gpa-value">0.00</span>
        </p>
        <hr>
        <p style="align-items: center;">
            <span style="font-size: 1.1rem; font-weight: 700;">総合 GPA (専門科目):<br><small id="electiveNote2" style="color:var(--text-muted); font-weight:normal;">(※選択科目は上位14単位分のみ合算)</small></span> 
            <span style="display: flex; align-items: center; gap: 10px;">
                <span id="gpaTotal" class="gpa-total-value">0.00</span>
                <button class="btn btn-secondary" onclick="copyGPA()" id="copyBtn" style="padding: 4px 10px; font-size: 0.85rem; margin: 0;">📋 コピー</button>
            </span>
        </p>
    </div>

    <div class="header-flex" style="margin-top: 40px;">
        <h2 style="margin: 0;">📚 登録済みの科目</h2>
        
        <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
            <select id="filterTerm" onchange="renderTable()" style="padding: 8px 12px; border-radius: var(--radius-md); border: 1px solid #cbd5e1; font-weight: 500; min-width: 180px;">
                <option value="all">すべての時期を表示</option>
                <option value="1年前期">1年前期</option>
                <option value="1年後期">1年後期</option>
                <option value="1年通期">1年通期</option>
                <option value="2年前期">2年前期</option>
                <option value="2年後期">2年後期</option>
                <option value="2年通期">2年通期</option>
                <option value="3年前期">3年前期</option>
                <option value="その他">その他</option>
            </select>
            <button class="btn btn-danger" onclick="resetAllData()" style="margin: 0;">データをリセット</button>
        </div>
    </div>
    
    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th class="text-center" style="width: 60px;">計算</th>
                    <th class="sortable" onclick="sortTable('term')">時期 <span id="sort-term" class="sort-icon"></span></th>
                    <th class="sortable" onclick="sortTable('name')">科目名 <span id="sort-name" class="sort-icon"></span></th>
                    <th class="sortable" onclick="sortTable('category')">区分 <span id="sort-category" class="sort-icon"></span></th>
                    <th class="sortable" onclick="sortTable('credits')">単位 <span id="sort-credits" class="sort-icon"></span></th>
                    <th class="sortable" onclick="sortTable('gradePoint')">成績 <span id="sort-gradePoint" class="sort-icon"></span></th>
                    <th class="sortable" onclick="sortTable('gradePoint')">評点 <span id="sort-gradePoint2" class="sort-icon"></span></th>
                    <th class="text-center" style="min-width: 120px;">操作</th>
                </tr>
            </thead>
            <tbody id="courseList">
                <!-- 追加された科目がここに表示されます -->
            </tbody>
        </table>
    </div>

    <script>
        const courseDatabase = {
            "1年前期": ["薬学概論Ⅰ", "薬学有機化学Ⅰ", "薬品分析化学", "生薬学Ⅰ"],
            "1年後期": ["基礎生物化学", "薬学有機化学Ⅱ", "機能形態学Ⅰ", "薬学物理化学Ⅰ"],
            "1年通期": [],
            "2年前期": ["機能形態学Ⅱ", "製剤学Ⅰ", "薬剤学Ⅰ", "有機反応化学Ⅰ", "有機反応化学Ⅱ", "薬学無機化学", "薬学概論Ⅱ", "機器分析化学", "環境衛生学", "生物薬品化学Ⅰ", "薬理学Ⅰ", "薬学英語Ⅰ", "薬学英語Ⅱ", "薬学物理化学Ⅱ"], 
            "2年後期": ["製剤学Ⅱ", "薬学物理化学Ⅲ", "衛生化学", "薬理学Ⅱ", "生物統計学Ⅰ", "生物統計学Ⅱ", "有機反応化学Ⅲ", "薬剤学Ⅱ", "生薬学Ⅱ", "生物薬品化学Ⅱ", "微生物感染症学", "細胞生物学Ⅰ", "物理系実習Ⅰ", "物理系実習Ⅱ", "化学系実習Ⅰ", "化学系実習Ⅱ", "化学系実習Ⅲ"],
            "2年通期": ["先端薬科学"],
            "3年前期": ["免疫学", "医薬品情報学", "病態生化学", "構造生物学", "薬学英語Ⅲ", "薬学英語Ⅳ", "薬理学Ⅲ", "臨床薬理学Ⅰ", "有機化学演習", "有機反応化学Ⅳ", "医薬品代謝学", "臨床薬理学Ⅱ", "細胞生物学Ⅱ", "生物系実習Ⅰ", "生物系実習Ⅱ", "生物系実習Ⅲ", "医療機能系実習Ⅰ", "医療機能系実習Ⅱ"] 
        };

        const electiveCourses = [
            "薬学有機化学Ⅱ", "先端薬科学", "環境衛生学", "薬学英語Ⅰ", "薬学英語Ⅱ", "薬学英語Ⅲ", "薬学英語Ⅳ",
            "薬学物理化学Ⅲ", "生物統計学Ⅱ", "薬剤学Ⅱ", "生物薬品化学Ⅱ", "有機化学演習", 
            "有機反応化学Ⅲ", "有機反応化学Ⅳ", "臨床薬理学Ⅰ", "臨床薬理学Ⅱ", "細胞生物学Ⅱ",
            "機器分析化学", "製剤学Ⅱ" 
        ];

        // 1単位の科目に「微生物感染症学」「細胞生物学Ⅰ・Ⅱ」を反映
        const oneCreditCourses = [
            "薬学概論Ⅰ", "薬学無機化学", "薬学概論Ⅱ", "薬学英語Ⅰ", "薬学英語Ⅱ", 
            "物理系実習Ⅰ", "物理系実習Ⅱ", "化学系実習Ⅰ", "化学系実習Ⅱ", "化学系実習Ⅲ", 
            "薬学英語Ⅲ", "薬学英語Ⅳ", "医薬品情報学", "病態生化学", "臨床薬理学Ⅰ", "臨床薬理学Ⅱ", "有機化学演習",
            "微生物感染症学", "細胞生物学Ⅰ", "細胞生物学Ⅱ", 
            "生物系実習Ⅰ", "生物系実習Ⅱ", "生物系実習Ⅲ", 
            "医療機能系実習Ⅰ", "医療機能系実習Ⅱ", 
            "生物統計学Ⅰ", "生物統計学Ⅱ"
        ];

        const allTerms = ["1年前期", "1年後期", "1年通期", "2年前期", "2年後期", "2年通期", "3年前期", "その他"];

        let courses = [];
        let editingIndex = -1;
        let currentSortColumn = '';
        let isSortAscending = true;

        function findTermByName(name) {
            for (let term in courseDatabase) {
                if (courseDatabase[term].includes(name)) return term;
            }
            return "その他";
        }

        window.onload = function() {
            document.getElementById('departmentSelect').value = 'life_science';

            const savedData = localStorage.getItem('gpa_courses_data');
            if (savedData) {
                courses = JSON.parse(savedData);
                courses.forEach(c => {
                    if (c.isIncluded === undefined) c.isIncluded = true;
                    if (c.term === undefined) c.term = findTermByName(c.name);
                    
                    if (c.score !== undefined && c.gradeStr === undefined) {
                        if (c.score >= 90) c.gradeStr = "秀";
                        else if (c.score >= 80) c.gradeStr = "優";
                        else if (c.score >= 70) c.gradeStr = "良";
                        else if (c.score >= 60) c.gradeStr = "可";
                        else c.gradeStr = "不可";
                        delete c.score; 
                    }
                });
            }
            updateView();
        };

        function renderTermCourses() {
            const term = document.getElementById('termSelect').value;
            const container = document.getElementById('termCourseContainer');
            const manualContainer = document.getElementById('manualInputContainer');
            const tbody = document.getElementById('termCourseBody');

            tbody.innerHTML = '';

            if (!term) {
                container.style.display = 'none';
                manualContainer.style.display = 'none';
                return;
            }

            if (term === 'manual') {
                container.style.display = 'none';
                manualContainer.style.display = 'block';
                return;
            }

            container.style.display = 'block';
            manualContainer.style.display = 'none';

            const enteredCourseNames = courses.map(c => c.name);
            const coursesInTerm = courseDatabase[term] || [];
            let count = 0;

            coursesInTerm.forEach((name, i) => {
                if (!enteredCourseNames.includes(name)) {
                    count++;
                    const isOneCredit = oneCreditCourses.includes(name) ? 1 : 2;
                    const isElective = electiveCourses.includes(name);

                    const checkboxProps = isElective 
                        ? '' 
                        : 'checked disabled style="cursor: not-allowed; opacity: 0.7;"';

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td style="font-weight: 500;">
                            <label for="chk_${i}" style="cursor: ${isElective ? 'pointer' : 'default'}; display: flex; align-items: center; gap: 8px; margin: 0; color: ${isElective ? '#334155' : '#3b82f6'}; white-space: nowrap;">
                                <input type="checkbox" id="chk_${i}" class="term-course-chk" data-name="${name}" ${checkboxProps} style="margin: 0;">
                                ${name}
                            </label>
                        </td>
                        <td>
                            <select id="cat_${i}" class="edit-input">
                                <option value="specialized_compulsory" ${!isElective ? 'selected' : ''}>専門(必修)</option>
                                <option value="specialized_elective" ${isElective ? 'selected' : ''}>専門(選択)</option>
                            </select>
                        </td>
                        <td><input type="number" id="cred_${i}" class="edit-input-num" value="${isOneCredit}" min="1"></td>
                        <td>
                            <select id="grade_${i}" class="edit-input" style="${!isElective ? 'border-color: #3b82f6;' : ''}">
                                <option value="" selected>--</option>
                                <option value="4|秀">秀 (4.0)</option>
                                <option value="3|優">優 (3.0)</option>
                                <option value="2|良">良 (2.0)</option>
                                <option value="1|可">可 (1.0)</option>
                                <option value="0|不可">不可 (0.0)</option>
                            </select>
                        </td>
                    `;
                    tbody.appendChild(tr);
                }
            });

            if (count === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center" style="color:var(--text-muted); padding: 24px;">この時期の科目はすべて登録済みです 🎉</td></tr>';
                document.getElementById('addCheckedBtn').style.display = 'none';
            } else {
                document.getElementById('addCheckedBtn').style.display = 'inline-flex';
            }
        }

        // 成績が「--」のものは無視して、エラーを出さずにスキップするように変更
        function addCheckedCourses() {
            const term = document.getElementById('termSelect').value;
            const checkboxes = document.querySelectorAll('.term-course-chk');
            
            let addedCount = 0;

            checkboxes.forEach(chk => {
                if (chk.checked) {
                    const i = chk.id.split('_')[1];
                    const gradeVal = document.getElementById(`grade_${i}`).value;
                    
                    // 成績が未選択の場合は単にスキップする（入力漏れエラーを出さない）
                    if (gradeVal === "") return;

                    const name = chk.getAttribute('data-name');
                    const category = document.getElementById(`cat_${i}`).value;
                    const credits = parseFloat(document.getElementById(`cred_${i}`).value);
                    
                    const [gpStr, gradeStr] = gradeVal.split('|');
                    const gradePoint = parseFloat(gpStr);

                    if (!isNaN(credits)) {
                        courses.push({ term, name, credits, gradeStr, gradePoint, category, isIncluded: true });
                        addedCount++;
                    }
                }
            });

            if (addedCount === 0) {
                alert("登録する科目がありません。（成績が選択されている科目がありません）");
                return;
            }

            updateView();
            renderTermCourses(); 
        }

        function addManualCourse() {
            const term = document.getElementById('manualTerm').value;
            const name = document.getElementById('manualName').value.trim();
            const category = document.getElementById('manualCategory').value;
            const credits = parseFloat(document.getElementById('manualCredits').value);
            const gradeVal = document.getElementById('manualGrade').value;

            if (!name) { alert("科目名を入力してください。"); return; }
            if (isNaN(credits)) { alert("単位数を正しく入力してください。"); return; }
            if (gradeVal === "") { alert("成績を選択してください。"); return; }

            const [gpStr, gradeStr] = gradeVal.split('|');
            const gradePoint = parseFloat(gpStr);

            courses.push({ term, name, credits, gradeStr, gradePoint, category, isIncluded: true });
            
            document.getElementById('manualName').value = '';
            document.getElementById('manualCredits').value = 2;
            document.getElementById('manualGrade').value = '';
            
            updateView();
        }

        function saveData() {
            localStorage.setItem('gpa_courses_data', JSON.stringify(courses));
        }

        function resetAllData() {
            if (confirm("登録されているすべての成績データを削除し、完全にリセットしますか？\n（この操作は取り消せません）")) {
                courses = [];
                editingIndex = -1;
                localStorage.removeItem('gpa_courses_data');
                updateView();
                renderTermCourses();
            }
        }

        // コピー機能
        function copyGPA() {
            const gpaText = document.getElementById('gpaTotal').innerText;
            navigator.clipboard.writeText(gpaText).then(() => {
                const btn = document.getElementById('copyBtn');
                const originalText = btn.innerHTML;
                btn.innerHTML = '✅ コピー完了';
                btn.style.backgroundColor = 'var(--success)';
                btn.style.color = '#fff';
                btn.style.borderColor = 'var(--success)';
                
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.style.backgroundColor = '';
                    btn.style.color = '';
                    btn.style.borderColor = '';
                }, 2000);
            }).catch(err => {
                alert('コピーに失敗しました。お手数ですが手動でコピーしてください。');
            });
        }

        function getCategoryName(val) {
            if (val === 'specialized_compulsory') return '専門科目(必修)';
            if (val === 'specialized_elective') return '専門科目(選択)';
            return 'その他';
        }

        function deleteCourse(index) {
            if (confirm(`「${courses[index].name}」を削除しますか？`)) {
                courses.splice(index, 1);
                editingIndex = -1;
                updateView();
                renderTermCourses(); 
            }
        }

        function toggleInclude(index) {
            if (editingIndex === index) return;
            courses[index].isIncluded = !courses[index].isIncluded;
            updateView();
        }

        function startEdit(index) {
            editingIndex = index;
            renderTable();
        }

        function cancelEdit() {
            editingIndex = -1;
            renderTable();
        }

        function saveEdit(index) {
            const tr = document.getElementById(`row-${index}`);
            const newTerm = tr.querySelector('.edit-term').value;
            const newName = tr.querySelector('.edit-name').value;
            const newCategory = tr.querySelector('.edit-category').value;
            const newCredits = parseFloat(tr.querySelector('.edit-credits').value);
            const newGradeVal = tr.querySelector('.edit-grade').value;

            if (isNaN(newCredits) || newName.trim() === "") {
                alert("科目名、単位数を正しく入力してください。");
                return;
            }

            const [gpStr, gradeStr] = newGradeVal.split('|');
            const gradePoint = parseFloat(gpStr);

            courses[index].term = newTerm;
            courses[index].name = newName;
            courses[index].category = newCategory;
            courses[index].credits = newCredits;
            courses[index].gradeStr = gradeStr;
            courses[index].gradePoint = gradePoint;

            editingIndex = -1;
            updateView();
            renderTermCourses();
        }

        function sortTable(column) {
            if (currentSortColumn === column) {
                isSortAscending = !isSortAscending;
            } else {
                currentSortColumn = column;
                isSortAscending = true;
            }

            courses.sort((a, b) => {
                let valA = a[column];
                let valB = b[column];

                if (column === 'category') {
                    valA = getCategoryName(valA);
                    valB = getCategoryName(valB);
                }

                if (valA === valB) return 0;

                if (typeof valA === 'string') {
                    return isSortAscending ? valA.localeCompare(valB, 'ja') : valB.localeCompare(valA, 'ja');
                } else {
                    return isSortAscending ? valA - valB : valB - valA;
                }
            });

            editingIndex = -1; 
            updateView();
        }

        function updateSortIcons() {
            const keys = ['term', 'name', 'category', 'credits', 'gradePoint'];
            keys.forEach(key => {
                const iconSpan = document.getElementById(`sort-${key}`);
                const iconSpan2 = document.getElementById(`sort-${key}2`);
                if (iconSpan) {
                    iconSpan.textContent = (currentSortColumn === key) ? (isSortAscending ? '▲' : '▼') : '';
                }
                if (iconSpan2) {
                    iconSpan2.textContent = (currentSortColumn === key) ? (isSortAscending ? '▲' : '▼') : '';
                }
            });
        }

        function updateView() {
            renderTable();
            calculateGPAs();
            saveData();
        }

        function renderTable() {
            const tbody = document.getElementById('courseList');
            tbody.innerHTML = '';
            
            const filterValue = document.getElementById('filterTerm') ? document.getElementById('filterTerm').value : 'all';
            let displayCount = 0;
            
            courses.forEach((course, index) => {
                if (filterValue !== 'all' && course.term !== filterValue && editingIndex !== index) {
                    return;
                }
                
                displayCount++;
                
                const tr = document.createElement('tr');
                tr.id = `row-${index}`;
                
                if (!course.isIncluded && editingIndex !== index) {
                    tr.className = 'excluded';
                }

                if (editingIndex === index) {
                    const termOptionsHtml = allTerms.map(t => 
                        `<option value="${t}" ${course.term === t ? 'selected' : ''}>${t}</option>`
                    ).join('');

                    tr.innerHTML = `
                        <td class="text-center">-</td>
                        <td><select class="edit-input edit-term">${termOptionsHtml}</select></td>
                        <td><input type="text" class="edit-input edit-name" value="${course.name}"></td>
                        <td>
                            <select class="edit-input edit-category">
                                <option value="specialized_compulsory" ${course.category === 'specialized_compulsory' ? 'selected' : ''}>専門(必修)</option>
                                <option value="specialized_elective" ${course.category === 'specialized_elective' ? 'selected' : ''}>専門(選択)</option>
                            </select>
                        </td>
                        <td><input type="number" class="edit-input-num edit-credits" value="${course.credits}" min="1"></td>
                        <td>
                            <select class="edit-input edit-grade">
                                <option value="4|秀" ${course.gradeStr === '秀' ? 'selected' : ''}>秀 (4.0)</option>
                                <option value="3|優" ${course.gradeStr === '優' ? 'selected' : ''}>優 (3.0)</option>
                                <option value="2|良" ${course.gradeStr === '良' ? 'selected' : ''}>良 (2.0)</option>
                                <option value="1|可" ${course.gradeStr === '可' ? 'selected' : ''}>可 (1.0)</option>
                                <option value="0|不可" ${course.gradeStr === '不可' ? 'selected' : ''}>不可 (0.0)</option>
                            </select>
                        </td>
                        <td>-</td>
                        <td class="text-center action-buttons">
                            <button class="btn btn-success btn-sm" onclick="saveEdit(${index})">保存</button>
                            <button class="btn btn-secondary btn-sm" onclick="cancelEdit()">取消</button>
                        </td>
                    `;
                } 
                else {
                    tr.innerHTML = `
                        <td class="text-center">
                            <input type="checkbox" ${course.isIncluded ? 'checked' : ''} onchange="toggleInclude(${index})">
                        </td>
                        <td>${course.term}</td>
                        <td style="font-weight: 500;">${course.name}</td>
                        <td><span style="font-size: 0.85em; padding: 2px 8px; background: #f1f5f9; border-radius: 99px;">${getCategoryName(course.category)}</span></td>
                        <td>${course.credits}</td>
                        <td style="font-weight: 700; color: ${course.gradeStr === '不可' ? 'var(--danger)' : 'inherit'}">${course.gradeStr}</td>
                        <td>${course.gradePoint.toFixed(1)}</td>
                        <td class="text-center action-buttons">
                            <button class="btn btn-edit btn-sm" onclick="startEdit(${index})">訂正</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteCourse(${index})">削除</button>
                        </td>
                    `;
                }
                tbody.appendChild(tr);
            });

            if (displayCount === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="text-center" style="color:var(--text-muted); padding: 24px;">該当する時期の登録済み科目はありません</td></tr>`;
            }

            updateSortIcons();
        }

        function calcStandardGPA(filteredCourses) {
            let totalCredits = 0;
            let totalPoints = 0;
            filteredCourses.forEach(c => {
                totalCredits += c.credits;
                totalPoints += c.credits * c.gradePoint;
            });
            return { gpa: totalCredits > 0 ? totalPoints / totalCredits : 0, credits: totalCredits, points: totalPoints };
        }

        function calcTopElectiveGPA(electives, maxCredits) {
            const sorted = [...electives].sort((a, b) => b.gradePoint - a.gradePoint);
            let usedCredits = 0;
            let totalPoints = 0;

            for (let c of sorted) {
                if (usedCredits >= maxCredits) break;
                let creditsToTake = Math.min(c.credits, maxCredits - usedCredits);
                usedCredits += creditsToTake;
                totalPoints += creditsToTake * c.gradePoint;
            }
            
            return { gpa: usedCredits > 0 ? totalPoints / usedCredits : 0, credits: usedCredits, points: totalPoints };
        }

        function calculateGPAs() {
            const maxElectiveCredits = 14;

            document.getElementById('electiveNote1').innerText = `(※成績上位${maxElectiveCredits}単位分のみ計算)`;
            document.getElementById('electiveNote2').innerText = `(※選択科目は上位${maxElectiveCredits}単位分のみ合算)`;

            const activeCourses = courses.filter(c => c.isIncluded);

            const compulsory = activeCourses.filter(c => c.category === 'specialized_compulsory');
            const elective = activeCourses.filter(c => c.category === 'specialized_elective');

            const compData = calcStandardGPA(compulsory);
            const eleData = calcTopElectiveGPA(elective, maxElectiveCredits);

            const totalValidCredits = compData.credits + eleData.credits;
            const totalValidPoints = compData.points + eleData.points;
            const totalGPA = totalValidCredits > 0 ? totalValidPoints / totalValidCredits : 0;

            document.getElementById('gpaCompulsory').innerText = compData.gpa.toFixed(2);
            document.getElementById('gpaElective').innerText = eleData.gpa.toFixed(2);
            document.getElementById('gpaTotal').innerText = totalGPA.toFixed(2);
        }
    </script>
</body>
</html>
